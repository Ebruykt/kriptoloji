function generateRandomKey(length) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
  let result = '';
  for (let i = 0; i < length; i++) {
    result += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return result;
}

// RSA ile Anahtar Üretimi
function generateKeyWithRSA(method){
  showKeyDisplay("RSA", "RSA anahtarı üretiliyor...", true);

  fetch('/api/generate-rsa-key', { method:'POST' })
    .then(res => res.json())
    .then(data => {
      const keyLength = method === "des" ? 8 : 16;
      const symKey = generateRandomKey(keyLength);

      document.getElementById('p-key').value = symKey;

      showKeyDisplay(
        method.toUpperCase().replace('_', ' '),
        `RSA Public Key:\n${data.public_key}\n\nÜretilen ${method.toUpperCase().replace('_', ' ')} Anahtarı:\n${symKey}`
      );
    })
    .catch(err => {
      showKeyDisplay("HATA", err.message);
    });
}
function generateECCKey(){
  showKeyDisplay("ECC", "ECC anahtarı üretiliyor...", true);

  fetch('/api/generate-ecc-key', { method:'POST' })
    .then(res => res.json())
    .then(data => {
      showKeyDisplay(
        "ECC",
        `Private Key:\n${data.private_key}\n\nPublic Key:\n${data.public_key}`
      );
    })
    .catch(err => {
      showKeyDisplay("HATA", err.message);
    });
}


function showKeyDisplay(type, key, loading = false) {
  const container = document.getElementById('key-display-container');
  container.innerHTML = `
    <div class="key-display">
      <div class="key-display-title">
        <i class="fas fa-key"></i>
        ${loading ? 'Üretiliyor...' : 'Üretilen ' + type + ' Anahtarı'}
      </div>
      <div style="color: #78350f;">${loading ? '<i class="fas fa-spinner fa-spin"></i> ' : ''}${key}</div>
    </div>
  `;
}

function copyToClipboard(){
  const output = document.getElementById('out').textContent;
  navigator.clipboard.writeText(output).then(() => {
    const btn = document.getElementById('copyBtn');
    const oldText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> Kopyalandı!';
    setTimeout(() => btn.innerHTML = oldText, 2000);
  });
}

function buildCustomSelect(nativeSelect){
  const wrap = document.createElement('div');
  wrap.className = 'custom-select';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'custom-select__btn';

  const caret = document.createElement('i');
  caret.className = 'fas fa-chevron-down';
  caret.style.opacity = '0.7';

  const label = document.createElement('span');
  label.textContent = nativeSelect.options[nativeSelect.selectedIndex]?.text || 'Seçiniz';

  btn.appendChild(label);
  btn.appendChild(caret);

  const list = document.createElement('div');
  list.className = 'custom-select__list';

  function refreshActive(){
    [...list.children].forEach(el => el.classList.remove('active'));
    const v = nativeSelect.value;
    const active = list.querySelector(`[data-value="${v}"]`);
    if(active) active.classList.add('active');
    label.textContent = nativeSelect.options[nativeSelect.selectedIndex]?.text || v;
  }

  [...nativeSelect.options].forEach(opt => {
    const item = document.createElement('div');
    item.className = 'custom-select__item';
    item.textContent = opt.text;
    item.dataset.value = opt.value;

    item.addEventListener('click', () => {
      nativeSelect.value = opt.value;
      nativeSelect.dispatchEvent(new Event('change'));
      wrap.classList.remove('open');
      refreshActive();
    });

    list.appendChild(item);
  });

  wrap.appendChild(btn);
  wrap.appendChild(list);

  nativeSelect.parentNode.insertBefore(wrap, nativeSelect.nextSibling);

  btn.addEventListener('click', (e) => {
    e.preventDefault();
    wrap.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if(!wrap.contains(e.target)) wrap.classList.remove('open');
  });

  nativeSelect.addEventListener('change', refreshActive);
  refreshActive();
}

async function loadAlgos(){
  const res = await fetch('/api/algorithms');
  const algos = await res.json();
  const sel = document.getElementById('method');
  
  // Algoritma isimlerini düzenle
  const algorithmLabels = {
    'aes': 'AES (Kütüphaneli)',
    'aes_manual': 'AES (Kütüphanesiz)',
    'des': 'DES',
    'caesar': 'Caesar',
    'vigenere': 'Vigenere',
    'substitution': 'Substitution',
    'affine': 'Affine',
    'hill': 'Hill',
    'railfence': 'Rail Fence',
    'route': 'Route',
    'columnar': 'Columnar',
    'pigpen': 'Pigpen',
    'polybius': 'Polybius',
    'playfair': 'Playfair',
    'ecc': 'ECC (Anahtar Üretimi)'

  };
  
  // Backend'den gelen algoritmaları değiştir
  const options = algos.map(a => {
    let value = a;
    let label = algorithmLabels[a] || a.toUpperCase();
    
   
    return `<option value="${value}">${label}</option>`;
  });
  
  sel.innerHTML = options.join('');
  sel.onchange = renderParams;
  renderParams();
  
  buildCustomSelect(sel);
}

// RSA ile Anahtar Üret Butonu Ekle
function renderParams(){
  const m = document.getElementById('method').value;
  const box = document.getElementById('params');
  const defs = PARAMS[m] || [];

  document.getElementById('key-display-container').innerHTML = '';

  const info = ALGO_INFO[m];
  if(info){
    document.getElementById('algorithm-info').style.display = 'block';
    document.getElementById('algo-description').textContent = info.desc;
    document.getElementById('algo-badges').innerHTML = info.badges.map(b =>
      `<span class="badge">${b}</span>`
    ).join('');
  } else {
    document.getElementById('algorithm-info').style.display = 'none';
  }

  // 🔵 1️⃣ ECC
  if (m === "ecc") {
    box.innerHTML = `
      <div class="param-group">
        <button class="btn-generate-key" onclick="generateECCKey()">
          <i class="fas fa-project-diagram"></i> ECC ile Anahtar Üret
        </button>
      </div>
    `;
    return;
  }

  // 🔵 2️⃣ AES ve DES
  else if (["aes_lib", "des"].includes(m)) {
    box.innerHTML = defs.map(p => {
      return `
        <div class="param-group">
          <label><i class="fas fa-key"></i> ${p.label}</label>
          <input
            id="p-${p.key}"
            type="${p.type}"
            value="${p.value ?? ''}"
            placeholder="Anahtar girin veya RSA ile üretin"
          />
        </div>`;
    }).join('');

    box.innerHTML += `
      <div class="param-group">
        <button class="btn-generate-key" onclick="generateKeyWithRSA('${m}')">
          <i class="fas fa-key"></i> RSA ile Anahtar Üret
        </button>
      </div>
    `;
    return;
  }

  // 🔵 3️⃣ DİĞER TÜM ALGORİTMALAR
  else {
    box.innerHTML = defs.map(p => {
      if(p.type === 'select'){
        return `
          <div class="param-group">
            <label><i class="fas fa-sliders-h"></i> ${p.label}</label>
            <select id="p-${p.key}">
              ${p.options.map(opt =>
                `<option value="${opt.value}" ${opt.value === p.value ? 'selected' : ''}>
                  ${opt.label}
                </option>`
              ).join('')}
            </select>
          </div>`;
      }

      return `
        <div class="param-group">
          <label><i class="fas fa-${p.type === 'number' ? 'hashtag' : 'key'}"></i> ${p.label}</label>
          <input
            id="p-${p.key}"
            type="${p.type}"
            value="${p.value ?? ''}"
            placeholder="${p.label}"
          />
        </div>`;
    }).join('');
  }
}


async function callApi(type){
  const method = document.getElementById('method').value;
  const text = document.getElementById('text').value;

  const opts = {};
  (PARAMS[method]||[]).forEach(p=>{
    const el = document.getElementById('p-'+p.key);
    if(el) opts[p.key] = el.value;
  });

  const res = await fetch('/api/' + type, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      method: method,
      text: text,
      options: opts
    })
  });

  const data = await res.json();

  const out = document.getElementById('out');
  const copyBtn = document.getElementById('copyBtn');

  if(data.result){
    out.textContent = data.result;
    out.className = 'output-box success';
    copyBtn.style.display = 'block';
  } else {
    out.textContent = data.error || 'Bir hata oluştu';
    out.className = 'output-box error';
    copyBtn.style.display = 'none';
  }
}

function readFile() {
  const fileInput = document.getElementById('fileInput');
  const file = fileInput.files[0];

  if (!file) return;

  if (!file.name.endsWith('.txt')) {
    alert("Lütfen sadece .txt dosyası yükleyin");
    fileInput.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    document.getElementById('text').value = e.target.result;
  };

  reader.readAsText(file, "UTF-8");
}


function downloadResult() {
  const output = document.getElementById('out').textContent;

  if (!output || output.includes("Sonuç burada görünecek")) {
    alert("İndirilecek bir sonuç yok.");
    return;
  }

  const blob = new Blob([output], { type: "text/plain;charset=utf-8" });
  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "sonuc.txt";
  link.click();
}
